<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Hinyunyu Space Race</title>
    <meta name="description" content="A cosy plush arcade game: dodge the meteors, catch the coins." />
    <meta name="theme-color" content="#0a0626" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Space Race" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preload" as="image" href="./img/logo.webp" />
    <link rel="preload" as="image" href="./img/ufo.webp" />
    <script type="module" crossorigin src="./assets/index-CJXfSXiW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BTswf2pL.css">
  </head>
  <body>
    <main id="app">
    <canvas id="stage" aria-hidden="true"></canvas>

    <!-- Menü -->
    <section id="menu" class="screen">
      <img class="logo" src="./img/logo.webp" alt="Hinyunyu Space Race" />
      <img class="menu-ufo" src="./img/ufo.webp" alt="" aria-hidden="true" />
      <div class="menu-bottom">
        <div class="best">
          <div class="caption" id="menu-best-title">BEST · MEDIUM</div>
          <div class="best-value" id="menu-best">0</div>
        </div>
        <button class="chunky primary turquoise" id="play">Play</button>
        <div class="links">
          <button class="link" id="open-leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3a1 1 0 0 1 1 1v2H7v-2a1 1 0 0 1 1-1h3v-2.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V6a1 1 0 0 1 1-1h3V3Zm10 4v4.8A3 3 0 0 0 19 9V7h-2ZM5 7v2a3 3 0 0 0 2 2.8V7H5Z"/></svg>Leaderboard</button>
          <button class="link" id="open-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.7 2l.5 2.6a8 8 0 0 1 1.9 1.1l2.5-.9 1.7 3-2 1.7a8 8 0 0 1 0 2.2l2 1.7-1.7 3-2.5-.9a8 8 0 0 1-1.9 1.1l-.5 2.6h-3.4l-.5-2.6a8 8 0 0 1-1.9-1.1l-2.5.9-1.7-3 2-1.7a8 8 0 0 1 0-2.2l-2-1.7 1.7-3 2.5.9a8 8 0 0 1 1.9-1.1l.5-2.6h3.4ZM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/></svg>Settings</button>
        </div>
        <div class="install-hint" id="install-hint" hidden></div>
      </div>
    </section>

    <!-- Játék: HUD és szünet -->
    <section id="game" class="screen" hidden>
      <div class="hud">
        <div><div class="hud-title">TIME</div><div class="hud-value" id="hud-time">0</div></div>
        <div class="right"><div class="hud-title">SCORE</div><div class="hud-value" id="hud-score">0</div></div>
      </div>
      <div class="pause" id="pause" hidden>
        <div class="pause-title">Paused</div>
        <div class="pause-sub">Tap to continue</div>
      </div>
    </section>

    <!-- Eredmény -->
    <section id="gameover" class="screen" hidden>
      <div class="spacer"></div>
      <h1 class="over-title">Game over</h1>
      <div class="over-score">
        <div class="caption">SCORE</div>
        <div class="over-value" id="over-score">0</div>
        <div class="over-meta" id="over-meta">0 s · Medium</div>
      </div>
      <div class="over-best" id="over-best"></div>
      <div class="over-rank" id="over-rank" hidden></div>
      <div class="spacer"></div>
      <button class="link" id="over-leaderboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3a1 1 0 0 1 1 1v2a5 5 0 0 1-4.6 5A5 5 0 0 1 13 15.9V18h3a1 1 0 0 1 1 1v2H7v-2a1 1 0 0 1 1-1h3v-2.1A5 5 0 0 1 7.6 13 5 5 0 0 1 3 8V6a1 1 0 0 1 1-1h3V3Zm10 4v4.8A3 3 0 0 0 19 9V7h-2ZM5 7v2a3 3 0 0 0 2 2.8V7H5Z"/></svg>Leaderboard</button>
      <button class="chunky primary" id="play-again">Play again</button>
      <button class="chunky secondary" id="to-menu">Menu</button>
    </section>

    </main>

    <!-- Lapok (sheet): beállítások és ranglista -->
    <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>

    <div class="sheet small" id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
      <header><span></span><h2 id="settings-title">Settings</h2><button class="done" data-close>Done</button></header>
      <div class="sheet-body">
        <div class="section-title">DIFFICULTY</div>
        <div class="picker" id="settings-picker"></div>
        <div class="group">
          <label class="toggle"><span>Sound effects</span><input type="checkbox" id="opt-sound" /><i></i></label>
          <label class="toggle"><span>Music</span><input type="checkbox" id="opt-music" /><i></i></label>
          <label class="toggle" id="opt-haptics-row"><span>Vibration</span><input type="checkbox" id="opt-haptics" /><i></i></label>
        </div>
      </div>
    </div>

    <div class="sheet" id="leaderboard" role="dialog" aria-modal="true" aria-labelledby="leaderboard-title" hidden>
      <header><span></span><h2 id="leaderboard-title">Leaderboard</h2><button class="done" data-close>Done</button></header>
      <div class="sheet-body">
        <div class="picker" id="leaderboard-picker"></div>
        <div class="entries" id="entries"></div>
      </div>
    </div>

  </body>
</html>
